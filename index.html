<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health & Care AI</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f9ff;
}

header{
background:#0d6efd;
color:white;
padding:30px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input{
width:90%;
padding:10px;
margin:10px;
font-size:16px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 20px;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>🏥 Health & Care AI</h1>
<p>Your Smart Health Assistant</p>
</header>

<div class="container">

<div class="card">
<h2>BMI Calculator</h2>

<input type="number" id="weight" placeholder="Weight (kg)">
<input type="number" id="height" placeholder="Height (cm)">

<button onclick="bmi()">Calculate BMI</button>

<h3 id="result"></h3>

</div>

<div class="card">
<h2>Healthy Tips</h2>

<ul>
<li>🥗 Eat more fruits and vegetables.</li>
<li>💧 Drink 2-3 liters of water daily.</li>
<li>🚶 Walk at least 30 minutes every day.</li>
<li>😴 Sleep 7-8 hours every night.</li>
</ul>

</div>

</div>

<footer>
© 2026 Health & Care AI
</footer>

<script>

function bmi(){

let w=document.getElementById("weight").value;

let h=document.getElementById("height").value/100;

let b=(w/(h*h)).toFixed(1);

document.getElementById("result").innerHTML="Your BMI = "+b;

}

</script>

</body>
</html>
